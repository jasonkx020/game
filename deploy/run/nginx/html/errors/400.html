<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 请求无效 · YCWL FreeTV</title>
  <link rel="stylesheet" href="/errors/ycwl-error.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark">YCWL</div>
      <div>
        <div class="brand-title">FreeTV 公交数字标牌</div>
        <div class="brand-sub">EDGE 网关 · Nginx</div>
      </div>
    </header>
    <section class="card">
      <p class="code warn">400</p>
      <h1 class="title">请求无效</h1>
      <p class="lead">服务器无法理解当前请求。常见于 URL 格式错误、请求头异常或上传体损坏。</p>
      <ul class="hints warn">
        <li>检查地址是否完整，避免多余空格或非法字符。</li>
        <li>大文件上传请确认未超过 Nginx <code>client_max_body_size</code> 限制。</li>
        <li>API 调用请使用正确的 <code>Content-Type</code> 与 JSON 格式。</li>
      </ul>
      <div class="actions">
        <a class="btn btn-primary" href="/">返回首页</a>
        <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
      </div>
      <p class="meta">运维提示：查看 <code>logs/error.log</code> 与对应 upstream 访问日志。</p>
    </section>
    <p class="footer">© YCWL · FreeTV EDGE Gateway</p>
  </main>
</body>
</html>
