# MinIO: dedicated HTTPS ports (:9002 API, :9003 Console)

upstream minio_api {
    least_conn;
    server 127.0.0.1:9000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream minio_console {
    least_conn;
    server 127.0.0.1:9001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 9002 ssl;
    http2 on;
    server_name _;

    include error-pages.inc;
    include ssl-params.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://minio_api;
    }

    access_log logs/minio_api_access.log minio_proxy;
    error_log  logs/minio_api_error.log;
}

server {
    listen 9003 ssl;
    http2 on;
    server_name _;

    include error-pages.inc;
    include ssl-params.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_pass http://minio_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nginx-Proxy true;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    access_log logs/minio_console_access.log minio_proxy;
    error_log  logs/minio_console_error.log;
}
