; ==================== MinIO Windows launcher config ====================
; Aligned with Linux scripts/service-minio.sh and deploy/docker-compose.edge.yml

[MinIO]
; Install root (minio.exe / mc.exe); "." = this directory
install_path = .
; Data directory
data_path = .\data
; S3 API and web console ports
api_port = 9000
console_port = 9001
; Bind address: 127.0.0.1 localhost only; 0.0.0.0 LAN (use firewall)
listen_bind = 127.0.0.1
; Default bucket (match YCWL_STORAGE_BUCKET)
bucket = freetv-assets
; Add Windows inbound firewall rules on start
add_firewall_rules = true
; Optional Console redirect URL when using a dedicated HTTPS port
browser_redirect_url =

[Credentials]
; Match tenant-api YCWL_STORAGE_ACCESS_KEY / SECRET_KEY (not minioadmin:minioadmin)
root_user = ycwlminio
root_password = YcwlMinioDev123

[Client]
; mc client alias
alias = ycwl-minio
; Empty = http://{listen_bind}:{api_port}
endpoint =
