# HTTP gateway — one public port for auth (OAuth) + game-api + admin.
# Do NOT rewrite/strip /v1 prefixes (HMAC signs the full request path).
#
# Local (services already on 8080/8081/8082):
#   nginx -c /absolute/path/to/deploy/nginx/gateway.conf
# Docker:
#   docker compose -f deploy/docker-compose.gateway.yml up -d
#   → http://localhost:8090/

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-gateway.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout combined;
    client_max_body_size 16m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    upstream auth_api {
        server 127.0.0.1:8081;
    }
    upstream admin_api {
        server 127.0.0.1:8082;
    }
    upstream game_api {
        server 127.0.0.1:8080;
    }

    server {
        listen 8090;
        server_name _;

        # Longest prefixes first (auth before admin).
        location /v1/admin/auth {
            proxy_pass http://auth_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/auth {
            proxy_pass http://auth_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/admin {
            proxy_pass http://admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/ {
            proxy_pass http://game_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Admin SPA + /docs
        location / {
            proxy_pass http://admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
