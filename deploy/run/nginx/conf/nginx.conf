# YCWL EDGE Nginx — portable reverse proxy (Windows / Linux)
#
# Prefix (-p): this directory's parent (deploy/run/nginx), containing conf/, logs/, html/
#   Windows:  start-nginx.bat
#   Linux:    ./start-nginx.sh
#
# Path rules (nginx -p <prefix> -c conf/nginx.conf):
#   logs/, pid, temp/  -> relative to prefix
#   ssl/, include files -> relative to conf/ (or conf/proxy/ for proxy/*.conf)
#
# TLS: place dev-server.crt/key or fullchain.pem/privkey.pem under conf/ssl/

worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

include stream.conf;

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    log_format minio_proxy '$remote_addr [$time_local] "$request" $status '
                           'upstream=$upstream_addr rt=$request_time';

    access_log logs/access.log main buffer=32k flush=5s;

    client_body_temp_path temp/client_body_temp;
    proxy_temp_path       temp/proxy_temp;
    fastcgi_temp_path     temp/fastcgi_temp;
    uwsgi_temp_path       temp/uwsgi_temp;
    scgi_temp_path        temp/scgi_temp;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    include error-maps.inc;
    include proxy/minio.conf;
    include proxy/tenant.conf;
    include proxy/platform.conf;
}
