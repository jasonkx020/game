/v1/admin/metrics/overview:
  get:
    tags: [Audit]
    summary: 运营 KPI 概览
    operationId: adminMetricsOverview
    security:
      - bearerAuth: []
        signatureAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/XAppId'
      - $ref: '../components/parameters.yaml#/XTimestamp'
      - $ref: '../components/parameters.yaml#/XNonce'
      - $ref: '../components/parameters.yaml#/XContentSha256'
      - $ref: '../components/parameters.yaml#/XSignature'
    responses:
      '200':
        description: 成功
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

/v1/admin/metrics/room-cards:
  get:
    tags: [Audit]
    summary: 房卡销售/消耗趋势
    operationId: adminMetricsRoomCards
    security:
      - bearerAuth: []
        signatureAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/XAppId'
      - $ref: '../components/parameters.yaml#/XTimestamp'
      - $ref: '../components/parameters.yaml#/XNonce'
      - $ref: '../components/parameters.yaml#/XContentSha256'
      - $ref: '../components/parameters.yaml#/XSignature'
      - name: days
        in: query
        schema:
          type: integer
          default: 7
    responses:
      '200':
        description: 成功
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

# Admin 登录/refresh/logout 已迁至 auth-service/openapi/paths/admin-auth.yaml
# （后台文档侧栏「Auth OpenAPI」）

/v1/admin/users:
  get:
    tags: [Admin]
    summary: 管理员用户列表（仅 platform_admin）
    operationId: adminListUsers
    security:
      - bearerAuth: []
        signatureAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/XAppId'
      - $ref: '../components/parameters.yaml#/XTimestamp'
      - $ref: '../components/parameters.yaml#/XNonce'
      - $ref: '../components/parameters.yaml#/XContentSha256'
      - $ref: '../components/parameters.yaml#/XSignature'
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        format: int64
                      phone_masked:
                        type: string
                      nickname:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      last_login_at:
                        type: string
                        format: date-time
                        nullable: true
                total:
                  type: integer
                page:
                  type: integer
                page_size:
                  type: integer
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

/v1/admin/players:
