# NanoMQ: MQTTS :8883 -> :1883; WSS :8084 -> WS :8083 (loopback only)
# Client URL path (e.g. wss://host:8084/mqtt) is handled by NanoMQ after TCP proxy.

stream {
    limit_conn_zone $binary_remote_addr zone=mqtt_per_ip:10m;

    upstream nanomq_mqtt {
        server 127.0.0.1:1883 max_fails=3 fail_timeout=30s;
    }

    upstream nanomq_ws {
        server 127.0.0.1:8083 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8883 ssl;
        proxy_pass nanomq_mqtt;

        proxy_connect_timeout 10s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
        tcp_nodelay on;

        limit_conn mqtt_per_ip 64;

        ssl_certificate     ssl/dev-server.crt;
        ssl_certificate_key ssl/dev-server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:MQTT_SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_handshake_timeout 10s;
    }

    server {
        listen 8084 ssl;
        proxy_pass nanomq_ws;

        proxy_connect_timeout 10s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
        tcp_nodelay on;

        limit_conn mqtt_per_ip 64;

        ssl_certificate     ssl/dev-server.crt;
        ssl_certificate_key ssl/dev-server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:MQTT_SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_handshake_timeout 10s;
    }
}
