# Tenant EDGE: HTTP redirect + HTTPS entry (:8081)

upstream tenant_api {
    server 127.0.0.1:8443;
    keepalive 16;
}

upstream tenant_web {
    server 127.0.0.1:2001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    include error-pages.inc;
    return 301 https://$host:8081$request_uri;
}


server {
    listen 8081 ssl;
    http2 on;
    server_name _;

    include error-pages.inc;
    include ssl-params.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2g;

    include proxy/minio-locations.inc;
    include proxy/tenant-locations.inc;
    #include proxy/platform-locations.inc;
}
