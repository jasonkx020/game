; ==================== NanoMQ Windows 启动配置 ====================
; 与 tenant-api YCWL_MQTT_BROKER_TYPE=nanomq 联调使用

[NanoMQ]
install_path = .
mqtt_port = 1883
ssl_port = 8883
ssl_enabled = false
http_port = 8082
ws_port = 8083
allow_anonymous = false
log_level = info
log_dir = log
add_firewall_rules = true

[TenantAPI]
; tenant-api 健康检查与 auth_http 回调基址（无尾部斜杠）
base_url = http://127.0.0.1:8443
health_path = /api/v1/health
auth_path = /api/v1/mqtt/auth
superuser_path = /api/v1/mqtt/superuser
acl_path = /api/v1/mqtt/acl
check_health_before_start = true

[TLS]
; ssl_enabled=true 时填写证书路径（相对 install_path 或绝对路径）
cert_file =
key_file =
ca_file =

[Hub]
; 与 tenant-api ycwl.mqtt.server_username/password 一致（仅文档对照，认证走 HTTP）
username = gouser
password = gouser@1234
