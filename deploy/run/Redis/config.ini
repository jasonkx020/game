; ==================== Redis Windows launcher config ====================
; Aligned with deploy/docker-compose.edge.yml and tenant-api redis.* settings

[Redis]
; Install root (redis-server.exe / redis-cli.exe); "." = this directory
install_path = .
; Persistence directory (RDB / AOF)
data_path = .\data
; Log directory
log_path = .\logs
; TCP port (match YCWL_REDIS_ADDR / REDIS_HOST_PORT)
port = 6379
; Bind address: 127.0.0.1 localhost only; 0.0.0.0 LAN (use firewall)
listen_bind = 127.0.0.1
; Base template and rendered runtime config
config_template = redis.windows.conf
conf_output = .\conf\redis.conf
; AOF persistence (docker-compose uses --appendonly yes)
appendonly = true
; Add Windows inbound firewall rules on start
add_firewall_rules = true
; background = detached like nginx; foreground = keep window open like minio
run_mode = background

[Credentials]
; Empty = no requirepass (OK with listen_bind=127.0.0.1); set for production
password =

[Client]
; redis-cli convenience alias label (informational)
alias = ycwl-redis
