<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 禁止访问 · YCWL FreeTV</title>
  <link rel="stylesheet" href="/errors/ycwl-error.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-mark">YCWL</div>
      <div>
        <div class="brand-title">FreeTV 公交数字标牌</div>
        <div class="brand-sub">EDGE 网关 · Nginx</div>
      </div>
    </header>
    <section class="card">
      <p class="code warn">403</p>
      <h1 class="title">无权访问此资源</h1>
      <p class="lead">您没有权限查看该页面或接口。MinIO、管理后台与 API 均需要正确的认证信息。</p>
      <ul class="hints warn">
        <li>租户后台与平台后台请先登录后再访问受保护路径。</li>
        <li>MinIO 控制台需使用 <code>config.ini</code> 中配置的 Access Key。</li>
        <li>设备与 Hub 的 MQTT 连接请使用 License 与 JWT，而非浏览器直接访问。</li>
      </ul>
      <div class="actions">
        <a class="btn btn-primary" href="/">返回首页</a>
      </div>
      <p class="meta">运维提示：确认 TLS 证书、防火墙规则与 upstream 鉴权配置。</p>
    </section>
    <p class="footer">© YCWL · FreeTV EDGE Gateway</p>
  </main>
</body>
</html>
