; ==================== GameS PostgreSQL launcher ====================
; Superuser password empty = peer/trust (stock Postgres default).
; Application password empty = init-db generates one and writes postgres.env / .env.

[PostgreSQL]
; "." = auto-detect Program Files\PostgreSQL\<version> or PATH
install_path=.
data_path=.\data
port=5432
listen_bind=127.0.0.1
version=16
; Windows: service | pg_ctl
run_mode=service
windows_service_name=
systemd_service_name=
add_firewall_rules=false
log_dir=log

[Superuser]
user=postgres
password=

[Application]
user=game
password=
db=game
; Optional physical Auth DB (empty = same as db)
db_auth=

[Init]
; game | auth | all
default_scope=game
write_env=true
