# Platform: platform admin dev proxy (:8080 HTTPS on deploy/run/nginx)

upstream emqx_dashboard {
    server 127.0.0.1:18083;
}

upstream emqx_mqtt_ws {
    server 127.0.0.1:8083;
}

upstream ycwl_platform_api {
    server 127.0.0.1:9443;
    keepalive 16;
}

upstream ycwl_platform_web {
    server 127.0.0.1:9443;
    keepalive 8;
}

# Platform admin dev: Vite :8090 + platform-api :9443
server {
    listen 8080 ssl;
    http2 on;
    server_name _;

    include error-pages.inc;
    include ssl-params.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;

    proxy_connect_timeout 60s;
    proxy_send_timeout 36s;
    proxy_read_timeout 36s;
    #include proxy/tenant-locations.inc;
    #include proxy/minio-locations.inc;
    include proxy/platform-locations.inc;   

    access_log logs/platform_api_access.log minio_proxy;
    error_log  logs/platform_api_error.log;
}
