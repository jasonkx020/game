services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional local auth-api (build from repo root auth-service/). Prefer `make run-auth` for hot reload.
  # auth-api:
  #   build:
  #     context: ../../auth-service
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     DATABASE_URL: postgres://game:game@postgres:5432/game?sslmode=disable
  #     REDIS_URL: redis://redis:6379/0
  #     JWT_PUBLIC_KEY_FILE: /keys/jwt-es256-dev.pub.pem
  #     HMAC_SECRET: dev-hmac-secret-change-me
  #     AUTH_HTTP_PORT: "8081"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
